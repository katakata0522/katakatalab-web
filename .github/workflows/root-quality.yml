name: Public Web Root Quality Check
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      root_mode:
        type: string
        default: all
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # 通知・手動検証は、進行中のmain/PR検証と取消境界を分ける。
  group: public-root-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && github.run_id || 'active' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  relevance:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      root: ${{ steps.select.outputs.root }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Root checks from the whole push
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node .github/scripts/public-pr-gate.cjs root-push

  quality:
    needs: relevance
    env:
      ROOT_BROWSER_SCOPE: ${{ inputs.root_mode || 'all' }}
    name: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && 'quality' || 'Draft quality' }}
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.relevance.outputs.root == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Playwright 1.60.0のheadless shellが対応するOSを使用する。
    runs-on: ubuntu-24.04
    # package-lockのPlaywrightと同版。ブラウザ・font・OS依存は公式の固定イメージで準備する。
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: ".node-version"
      - name: Prepare required command-line tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-inside-work-tree)" = true
          if ! ( command -v python3 >/dev/null ); then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
      - name: Prepare published media as ephemeral CI dependencies
        run: python3 scripts/public-qa/prepare.py
      - name: Product contracts and isolated Node tests
        run: |
          node scripts/public-qa/test-root.cjs
          node scripts/run-public-node-tests.cjs
      - name: Build reviewed public root
        run: |
          node scripts/build-project-cards.cjs
          git diff --exit-code -- index.html
          node .github/scripts/build-public-root.cjs
          test ! -e public-build/motion-atlas-source
      - name: Verify Motion Atlas matches the published assets
        if: env.ROOT_BROWSER_SCOPE == 'all' || env.ROOT_BROWSER_SCOPE == 'motion-atlas-source'
        working-directory: motion-atlas-source
        run: |
          npm audit --package-lock-only --ignore-scripts --audit-level=low
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          npm test
          node scripts/prepare-katakatalab.mjs --check ..
      - name: Install locked browser tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node .github/scripts/verify-playwright-runtime.cjs
      - name: Existing public tools and education privacy browser checks
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          set -euo pipefail
          case "$ROOT_BROWSER_SCOPE" in
            home) node .github/scripts/local-tools-e2e.mjs ;;
            qrcode) node qrcode/tests/quality-browser-smoke.cjs ;;
            emphasis-lines) node emphasis-lines/tests/browser-regression.cjs ;;
            motion-atlas-source) ;; # 上のステップで専用ビルドと掲載物を照合済み。
            all)
              node .github/scripts/local-tools-e2e.mjs
              node qrcode/tests/quality-browser-smoke.cjs
              node emphasis-lines/tests/browser-regression.cjs
              node .github/scripts/education-privacy-e2e.cjs --root-build
              ;;
            *) exit 1 ;;
          esac
      - name: Publication contracts
        run: |
          node scripts/education-no-tracking.cjs --root-build
          node scripts/audit-publisher-quality.cjs
          node scripts/audit-seo-metadata.cjs
