name: Public Web Root Quality Check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore: ["pikalab/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Draft通知と手動検証を、配信用main検証・実PR検証から分離する。
  group: public-root-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && github.run_id || 'active' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && 'quality' || 'Draft quality' }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # package-lockのPlaywrightと同版。ブラウザ・font・OS依存は公式の固定イメージで準備する。
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Prepare required command-line tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-inside-work-tree)" = true
          if ! ( command -v python3 >/dev/null ); then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
      - name: Prepare published media as ephemeral CI dependencies
        run: python3 scripts/public-qa/prepare.py
      - name: Product contracts and isolated Node tests
        run: |
          node scripts/public-qa/test-root.cjs
          node scripts/run-public-node-tests.cjs
      - name: Build reviewed public root
        run: |
          node scripts/build-project-cards.cjs
          git diff --exit-code -- index.html
          node .github/scripts/build-public-root.cjs
      - name: Install locked browser tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node .github/scripts/verify-playwright-runtime.cjs
      - name: Existing public tools and education privacy browser checks
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node .github/scripts/local-tools-e2e.mjs
          node qrcode/tests/quality-browser-smoke.cjs
          node emphasis-lines/tests/browser-regression.cjs
          node .github/scripts/education-privacy-e2e.cjs --root-build
      - name: Publication contracts
        run: |
          node scripts/education-no-tracking.cjs --root-build
          node scripts/audit-publisher-quality.cjs
          node scripts/audit-seo-metadata.cjs
