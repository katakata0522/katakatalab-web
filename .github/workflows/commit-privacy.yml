name: New commit email privacy
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the checker
        working-directory: scripts/commit-privacy
        run: python3 -m unittest -q
      - name: Check source and GitHub merge commits after the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/commit-privacy/commit_privacy_preflight.py
          --repo . --ref "$SOURCE_SHA" --ref "$MERGE_SHA"
          --exclude-ref "$BASE_SHA"
