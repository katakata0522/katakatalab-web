name: Node LTS update check
on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check the official Node LTS index
        run: python3 scripts/public-qa/node_runtime.py --check
