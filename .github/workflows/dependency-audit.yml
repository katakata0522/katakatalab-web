name: Public dependency audit
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Test advisory classification
        run: node --test .github/scripts/audit-dependencies.test.cjs
      - name: Audit Root and PikaLab locks against current advisories
        run: npm run audit:dependencies
