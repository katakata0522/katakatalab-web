            <h2 id="overview-title">この曲の概要</h2>
            <p>「Subtitle」は、フジテレビ系ドラマ『silent』のために書き下ろされた主題歌。2022年10月12日に配信され、2024年発売のアルバム『Rejoice』には10曲目として収録された。</p>
            <p>ドラマ公式サイトによると、バンドは企画書と台本を読んで作品の世界観に共感し、曲を制作した。藤原聡は、メンバーと細部までこだわって作り上げたと語っている。ピアノを中心とした伴奏に、言葉を細かく運ぶ歌が重なる。</p>
