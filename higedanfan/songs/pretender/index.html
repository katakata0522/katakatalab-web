            <h2 id="overview-title">この曲の概要</h2>
            <p>「Pretender」は、映画『コンフィデンスマンJP』の主題歌として制作され、2019年4月17日に先行配信された。同年5月15日にシングルとして発売され、10月9日発売のアルバム『Traveler』には12曲目として収録された。</p>
            <p>バンドはシングルの特設サイトで、映画から感じ取った寂しさや儚さが制作の出発点になったと語っている。藤原聡は後の公式対談で、プロデューサーの提案を受けてUKロックの音作りを取り入れたとも振り返った。メロディーと歌詞にはJ-POPの感覚を残しながら、音の作り方を広げた曲だ。</p>
