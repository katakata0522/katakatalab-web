<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none';"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ページが見つかりません｜動きの仕組み図鑑</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f6;
        color: #18181b;
        font-family: "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="margin: 0 0 8px; font-size: 20px;">ページが見つかりません</h1>
      <p style="margin: 0; color: #52525b; font-size: 14px; line-height: 1.6;">
        お探しのページは移動したか削除された可能性があります。
      </p>
      <a href="./">図鑑のトップへ戻る</a>
    </div>
  </body>
</html>
